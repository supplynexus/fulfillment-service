version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: fulfillment_service_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - fulfillment_dev_network

  # Redis Cache and Message Broker
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    networks:
      - fulfillment_dev_network

  # Backend API (Development)
  backend_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fulfillment_service_dev
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: dev-secret-key-not-for-production
      SHOPIFY_API_KEY: dev-shopify-api-key
      SHOPIFY_API_SECRET: dev-shopify-api-secret
      PRINTIFY_API_TOKEN: dev-printify-api-token
      WEBHOOK_SECRET: dev-webhook-secret
      ENVIRONMENT: development
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      ALLOWED_HOSTS: localhost,127.0.0.1,backend_dev
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - fulfillment_dev_network
    restart: unless-stopped

  # Celery Worker (Development)
  celery_worker_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=debug --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fulfillment_service_dev
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: dev-secret-key-not-for-production
      SHOPIFY_API_KEY: dev-shopify-api-key
      SHOPIFY_API_SECRET: dev-shopify-api-secret
      PRINTIFY_API_TOKEN: dev-printify-api-token
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - fulfillment_dev_network
    restart: unless-stopped

  # Flower (Celery Monitoring)
  flower_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app flower --port=5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - fulfillment_dev_network
    restart: unless-stopped

  # Frontend (Development)
  frontend_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend_dev
    networks:
      - fulfillment_dev_network
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  fulfillment_dev_network:
    driver: bridge
