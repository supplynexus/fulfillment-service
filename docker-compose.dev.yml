version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: supplynexus
      POSTGRES_USER: supplynexus_admin
      POSTGRES_PASSWORD: aabbccdd
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - fulfillment_dev_network

  # Redis Cache and Message Broker
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    networks:
      - fulfillment_dev_network

  # Backend API (Dev)
  backend_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://supplynexus_admin:aabbccdd@postgres:5432/supplynexus
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: dev-secret-key-not-for-prod
      SHOPIFY_API_KEY: dev-shopify-api-key
      SHOPIFY_API_SECRET: dev-shopify-api-secret
      PRINTIFY_API_TOKEN: dev-printify-api-token
      WEBHOOK_SECRET: dev-webhook-secret
      ENVIRONMENT: dev
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      ALLOWED_HOSTS: localhost,127.0.0.1,backend_dev
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"  # Dev 环境使用 8001，避免与 prod 的 8000 冲突
    depends_on:
      - postgres
      - redis
    networks:
      - fulfillment_dev_network
    restart: unless-stopped

  # Celery Worker (Dev)
  celery_worker_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=debug
    environment:
      DATABASE_URL: postgresql+asyncpg://supplynexus_admin:aabbccdd@postgres:5432/supplynexus
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: dev-secret-key-not-for-prod
      SHOPIFY_API_KEY: dev-shopify-api-key
      SHOPIFY_API_SECRET: dev-shopify-api-secret
      PRINTIFY_API_TOKEN: dev-printify-api-token
      ENVIRONMENT: dev
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - fulfillment_dev_network
    restart: unless-stopped

  # Flower (Celery Monitoring)
  flower_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app flower --port=5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - fulfillment_dev_network
    restart: unless-stopped

  # Frontend (Dev)
  frontend_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://backend_dev:8000
      BACKEND_API_URL: http://backend_dev:8000
      NODE_ENV: dev
      NEXT_PUBLIC_ENVIRONMENT: dev
      NEXT_PUBLIC_VERSION: 1.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"  # Dev 环境使用 3001，避免与 prod 的 3000 冲突
    depends_on:
      - backend_dev
    networks:
      - fulfillment_dev_network
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  fulfillment_dev_network:
    driver: bridge
