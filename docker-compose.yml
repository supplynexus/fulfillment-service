version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: supplynexus
      POSTGRES_USER: supplynexus_admin
      POSTGRES_PASSWORD: change-in-prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql  # Removed - no init.sql file
    ports:
      - "5432:5432"
    networks:
      - fulfillment_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache and Message Broker
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - fulfillment_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://supplynexus_admin:change-in-prod@postgres:5432/supplynexus
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: your-secret-key-change-in-prod
      SHOPIFY_API_KEY: your-shopify-api-key
      SHOPIFY_API_SECRET: your-shopify-api-secret
      PRINTIFY_API_TOKEN: your-printify-api-token
      WEBHOOK_SECRET: your-webhook-secret
      ENVIRONMENT: dev
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fulfillment_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://supplynexus_admin:change-in-prod@postgres:5432/supplynexus
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: your-secret-key-change-in-prod
      SHOPIFY_API_KEY: your-shopify-api-key
      SHOPIFY_API_SECRET: your-shopify-api-secret
      PRINTIFY_API_TOKEN: your-printify-api-token
      ENVIRONMENT: dev
    volumes:
      - ./backend:/app
      - worker_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fulfillment_network
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://supplynexus_admin:change-in-prod@postgres:5432/supplynexus
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: your-secret-key-change-in-prod
      SHOPIFY_API_KEY: your-shopify-api-key
      SHOPIFY_API_SECRET: your-shopify-api-secret
      PRINTIFY_API_TOKEN: your-printify-api-token
      ENVIRONMENT: dev
    volumes:
      - ./backend:/app
      - beat_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fulfillment_network
    restart: unless-stopped

  # Flower (Celery Monitoring)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app flower --port=5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - fulfillment_network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      BACKEND_API_URL: http://backend:8000
      NODE_ENV: production
    volumes:
      - ./frontend/keys:/app/keys
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fulfillment_network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./deployment/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - fulfillment_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  worker_logs:
  beat_logs:

networks:
  fulfillment_network:
    driver: bridge
