server {
    listen 80;
    server_name admin.supplynexus.store;

    # 暂时使用 HTTP，稍后配置 SSL 证书后启用 HTTPS 重定向
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/admin.supplynexus.store.access.log;
    error_log /var/log/nginx/admin.supplynexus.store.error.log;

    # 前端（Next.js）- 生产环境使用 3000 端口
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 只有 /api/v1/* 走后端 FastAPI - 生产环境使用 8000 端口
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host api.supplynexus.store;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # WebSocket 支持（如果需要）
    location /_next/webpack-hmr {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.supplynexus.store;

    # SSL 证书配置（已存在，取消注释）
    ssl_certificate /etc/letsencrypt/live/admin.supplynexus.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.supplynexus.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

