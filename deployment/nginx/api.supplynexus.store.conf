server {
    listen 80;
    server_name api.supplynexus.store;

    # 暂时使用 HTTP，稍后配置 SSL 证书后启用 HTTPS 重定向
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/api.supplynexus.store.access.log;
    error_log /var/log/nginx/api.supplynexus.store.error.log;

    # 后端 API - 生产环境使用 8000 端口
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host api.supplynexus.store;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

server {
    listen 443 ssl http2;
    server_name api.supplynexus.store;

    # SSL 证书配置（需要先运行 certbot 申请证书）
