# SupplyNexus Backend API Nginx Configuration
# 适用于 Ubuntu 系统上的 Nginx
# 部署时请根据实际情况修改域名、SSL 证书路径等配置

# 后端 API 上游服务器配置
upstream backend_api {
    server 127.0.0.1:8000;  # Docker 容器暴露的端口
    # 可以添加多个后端服务器进行负载均衡
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;
    
    # 健康检查配置
    keepalive 32;
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name api.dev.supplynexus.store;  # 请根据实际域名修改
    
    # 重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS 服务器配置
server {
    listen 443 ssl http2;
    server_name api.dev.supplynexus.store;  # 请根据实际域名修改
    
    # SSL 证书配置 - 请根据实际证书路径修改
    ssl_certificate /etc/letsencrypt/live/api.dev.supplynexus.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dev.supplynexus.store/privkey.pem;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 安全头配置
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    
    # 客户端配置
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    
    # 代理超时设置
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    
    # 主要 API 路由
    location / {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # 保持连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # 健康检查端点 - 不需要缓存
    location ~ ^/api/v1/health {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 禁用缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # 健康检查不需要详细日志
        access_log /var/log/nginx/health_check.log;
    }
    
    # API 文档端点 - 不需要缓存
    location ~ ^/api/v1/docs {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 禁用缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # 简化的健康检查端点（用于 Nginx 健康检查）
    location /health {
        proxy_pass http://backend_api/api/v1/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 健康检查不记录访问日志
        access_log off;
    }
    
    # 静态文件缓存（如果有的话）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # 日志配置
    access_log /var/log/nginx/api.dev.supplynexus.store.access.log;
    error_log /var/log/nginx/api.dev.supplynexus.store.error.log;
    
    # 错误页面
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
