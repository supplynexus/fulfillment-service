version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: supplynexus
      POSTGRES_USER: supplynexus_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - fulfillment_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache and Message Broker
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - fulfillment_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - ../environments/${ENV_FILE:-env.development}
    volumes:
      - ../../backend:/app
      - backend_logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fulfillment_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Celery Worker
  celery_worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - ../environments/${ENV_FILE:-env.development}
    volumes:
      - ../../backend:/app
      - worker_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fulfillment_network
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - ../environments/${ENV_FILE:-env.development}
    volumes:
      - ../../backend:/app
      - beat_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fulfillment_network
    restart: unless-stopped

  # Flower (Celery Monitoring)
  flower:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app flower --port=5555
    env_file:
      - ../environments/${ENV_FILE:-env.development}
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fulfillment_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  worker_logs:
  beat_logs:

networks:
  fulfillment_network:
    driver: bridge
