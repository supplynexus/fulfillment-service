version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ${DATA_DIR}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - redis-network

networks:
  redis-network:
    driver: bridge
